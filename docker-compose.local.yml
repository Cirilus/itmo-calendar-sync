services:
  app:
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      LISTEN_ADDR: 0.0.0.0:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/itmo-calendar-sync", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
